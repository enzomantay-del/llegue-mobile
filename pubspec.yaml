name: llegue_mobile
description: "Llegué — tranquilidad familiar cuando los chicos salen solos."
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  permission_handler: 12.0.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  google_fonts: ^8.2.1
  flutter_local_notifications: ^22.3.0
  battery_plus: ^7.1.1
  device_info_plus: ^13.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  wakelock_plus: ^1.7.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_launcher.png
  adaptive_icon_background: "#146B56"
  adaptive_icon_foreground: assets/brand/app_icon_launcher.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
